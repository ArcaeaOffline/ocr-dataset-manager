[project]
name = "odm-backend"
version = "0.1.0"
description = "Backend for the OCR dataset annotation tool"
requires-python = ">=3.11"
dependencies = [
    "arcaea-offline-ocr",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2",
    "rapidocr[onnxruntime]>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
