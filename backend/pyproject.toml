[project]
name = "odm-backend"
version = "0.1.0"
description = "Backend for the OCR dataset annotation tool"
requires-python = ">=3.11"
dependencies = [
    "arcaea-offline-ocr",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "rapidocr[onnxruntime]>=2",
    "typing-extensions>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "httpx2>=2,<3",
    "pytest>=8",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: real-OCR end-to-end smoke on fixtures; opt in with -m slow",
]
