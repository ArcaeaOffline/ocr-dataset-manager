[project]
name = "odm-backend"
version = "0.1.0"
description = "Backend for the OCR dataset annotation tool"
requires-python = ">=3.11"
dependencies = [
    "arcaea-offline-ocr>=0.1.2b0",
    "fastapi>=0.115",
    "fastapi-problem-details>=0.1.5",
    "pydantic>=2",
    "uvicorn>=0.30",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "rapidocr[onnxruntime]>=2",
    "typing-extensions>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
odm = "app.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "httpx2>=2,<3",
    "pytest>=8",
    "pyinstaller>=6.10",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: real-OCR end-to-end smoke on fixtures; deselect with -m 'not slow'",
]

[tool.ruff.lint]
# docs.astral.sh/ruff "popular rules" example set: pycodestyle, pyflakes,
# isort, pyupgrade, flake8-bugbear, flake8-simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in parameter defaults is FastAPI's dependency declaration
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.basedpyright]
typeCheckingMode = "recommended"
reportUnusedCallResult = "none"

# Any/Unknown cascade comes from untyped third parties (rapidocr, cv2);
# not fixable on our side
reportAny = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

# Depends() in endpoint parameter defaults is FastAPI's dependency
# declaration syntax
reportCallInDefaultInitializer = "none"

# SQLAlchemy declarative dunders (__tablename__, __table_args__) can't take
# useful annotations
reportUnannotatedClassAttribute = "none"

# alembic's upgrade()/downgrade() template signature leaves op unused in
# most revisions
[[tool.basedpyright.executionEnvironments]]
root = "migrations"
reportUnusedParameter = "none"

# tests assert against module internals by design
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
