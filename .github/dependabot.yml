version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # minor and patch updates share one PR per ecosystem; majors stay separate
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
