[project]
name = "ocr-dataset-manager"
version = "0.1.0"
description = "Annotation tool for Arcaea result screenshot OCR datasets"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
arcaea-offline-ocr = { path = "../core-ocr" }

[tool.ruff.lint]
# docs.astral.sh/ruff "popular rules" example set: pycodestyle, pyflakes,
# isort, pyupgrade, flake8-bugbear, flake8-simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in parameter defaults is FastAPI's dependency declaration
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.basedpyright]
typeCheckingMode = "recommended"
exclude = ["scripts"]
reportUnusedCallResult = "none"

# Any/Unknown cascade comes from untyped third parties (rapidocr, cv2);
# not fixable on our side
reportAny = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

# Depends() in endpoint parameter defaults is FastAPI's dependency
# declaration syntax
reportCallInDefaultInitializer = "none"

# SQLAlchemy declarative dunders (__tablename__, __table_args__) can't take
# useful annotations
reportUnannotatedClassAttribute = "none"

# alembic's upgrade()/downgrade() template signature leaves op unused in
# most revisions
[[tool.basedpyright.executionEnvironments]]
root = "backend/migrations"
reportUnusedParameter = "none"

# tests assert against module internals by design
[[tool.basedpyright.executionEnvironments]]
root = "backend/tests"
reportPrivateUsage = "none"
